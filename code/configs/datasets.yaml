duplicate_audit:
  exact_hash: SHA-256
  perceptual_hash: imagehash.phash
  hash_size: 8
  highfreq_factor: 4
  phash_bits: 64
  candidate_hamming_threshold: 4
  candidate_confirmation: visual_verification
  grouping: transitive_connected_components
